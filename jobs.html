<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Gigs · Repost</title>
  <meta name="theme-color" content="#0a0912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-ambient noise" aria-hidden="true"></div>

  <main class="app-main">
    <p class="page-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
      Sharer gigs
    </p>
    <h1 class="page-h1">Your shares &amp; payouts</h1>

    <!-- Stats -->
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)" id="jobStats"></div>

    <!-- Tabs -->
    <div class="tab-row" id="tabRow"></div>

    <!-- List -->
    <div id="jobsList" style="margin-top:1.25rem"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    buildAppShell("jobs");

    const jobs = MOCK_JOBS;
    let activeTab = "all";

    const earned = jobs.filter(j => j.status === "approved").reduce((a, j) => a + j.campaign.perShareCents, 0);
    const toShare = jobs.filter(j => j.status === "accepted").length;
    const inReview = jobs.filter(j => j.status === "pending").length;

    // Stats
    const statsEl = document.getElementById("jobStats");
    [
      { label: "Total earned", value: formatMoney(earned), color: "color:var(--color-volt)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>` },
      { label: "Slots to share", value: String(toShare), color: "color:#7dd3fc", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>` },
      { label: "In review", value: String(inReview), color: "color:#fbbf24", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-1.293 1.293A1 1 0 006 18h12a1 1 0 00.707-1.707L18 16z"/></svg>` },
    ].forEach(s => {
      statsEl.innerHTML += `<div class="stat-card panel"><span style="${s.color}">${s.icon}</span><p class="stat-val">${s.value}</p><p class="stat-lbl">${s.label}</p></div>`;
    });

    // Tabs
    const TABS = [
      { key: "all", label: "All" }, { key: "accepted", label: "To share" },
      { key: "pending", label: "In review" }, { key: "approved", label: "Paid" }, { key: "rejected", label: "Rejected" },
    ];
    const tabRow = document.getElementById("tabRow");
    TABS.forEach(t => {
      const count = t.key === "all" ? jobs.length : jobs.filter(j => j.status === t.key).length;
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (t.key === "all" ? " active" : "");
      btn.innerHTML = `${t.label} <span class="tab-count">${count}</span>`;
      btn.addEventListener("click", () => {
        activeTab = t.key;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderJobs();
      });
      tabRow.appendChild(btn);
    });

    function renderJobs() {
      const list = document.getElementById("jobsList");
      const filtered = activeTab === "all" ? jobs : jobs.filter(j => j.status === activeTab);
      if (filtered.length === 0) {
        list.innerHTML = `<div class="panel empty-state">
          <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg></span>
          <h3 class="empty-title">No gigs here yet</h3>
          <p class="empty-sub">Head to the feed and reserve a slot — your first payout is one share away.</p>
          <a href="feed.html" class="btn-volt">Browse campaigns <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
        </div>`;
        return;
      }
      list.innerHTML = filtered.map(j => {
        const amtColor = j.status === "approved" ? "color:var(--color-volt)" : "";
        const sign = j.status === "approved" ? "+" : "";
        return `
          <a href="campaign.html?id=${j.campaign.id}" class="list-item">
            <img src="${j.campaign.imageUrl}" alt="" class="list-item-img" onerror="this.style.background='linear-gradient(135deg,#1a0a2e,#0a1a0a)'">
            <div class="list-item-body">
              <div style="display:flex;flex-wrap:wrap;gap:0.375rem;margin-bottom:0.25rem">
                ${statusBadgeHtml(j.status)}
                ${j.status === "approved" && j.rating ? starsHtml(j.rating) : ""}
              </div>
              <p class="list-item-title">${j.campaign.title}</p>
              <p class="list-item-sub">by ${j.campaign.creatorName} · ${j.status === "approved" ? "paid " + timeAgo(j.reviewedAt) : "claimed " + timeAgo(j.createdAt)}</p>
              ${j.rejectReason ? `<p style="font-size:0.75rem;font-style:italic;color:rgba(251,113,133,0.8);margin-top:0.25rem">"${j.rejectReason}"</p>` : ""}
            </div>
            <div class="list-item-right">
              <p style="font-family:var(--font-display);font-size:1.125rem;font-weight:800;${amtColor}">${sign}${formatMoney(j.campaign.perShareCents)}</p>
              <p style="font-size:0.6875rem;font-family:var(--font-display);font-weight:700;color:var(--color-mute);margin-top:0.25rem;display:flex;align-items:center;gap:0.25rem">
                ${j.status === "accepted" ? "Submit proof" : "Open"} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </p>
            </div>
          </a>`;
      }).join("");
    }
    renderJobs();
  </script>
</body>
</html>
