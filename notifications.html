<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications · Repost</title>
  <meta name="theme-color" content="#0a0912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-ambient noise" aria-hidden="true"></div>

  <main class="app-main">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem">
      <div>
        <p class="page-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
        </p>
        <h1 class="page-h1">Notifications</h1>
      </div>
      <button class="btn-ghost" id="markAllBtn" style="display:none">Mark all as read</button>
    </div>

    <div id="notifList"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    buildAppShell(); // no active tab

    const notifs = [...MOCK_NOTIFICATIONS]; // Clone so we can mutate

    function renderNotifs() {
      const list = document.getElementById("notifList");
      const unreadCount = notifs.filter(n => !n.read).length;

      document.getElementById("markAllBtn").style.display = unreadCount > 0 ? "inline-block" : "none";

      if (notifs.length === 0) {
        list.innerHTML = `<div class="panel empty-state">
          <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <h3 class="empty-title">All caught up</h3>
          <p class="empty-sub">You have no new notifications.</p>
        </div>`;
        return;
      }

      list.innerHTML = notifs.map(n => `
        <div class="panel" style="display:flex;gap:1rem;padding:1.25rem;margin-bottom:0.75rem;cursor:pointer;transition:transform 0.2s;${n.read ? "opacity:0.6;background:rgba(21,18,36,0.3)" : "border-color:rgba(205,240,75,0.4)"}" onclick="markRead('${n.id}')">
          <div style="flex-shrink:0;position:relative;top:0.25rem">
            ${n.read ? `<svg viewBox="0 0 24 24" fill="none" stroke="var(--color-mute)" stroke-width="2" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>`
                     : `<svg viewBox="0 0 24 24" fill="none" stroke="var(--color-volt)" stroke-width="2" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><circle cx="21" cy="4" r="3" fill="var(--color-volt)" stroke="var(--color-ink)"/></svg>`}
          </div>
          <div>
            <p style="font-size:0.875rem;line-height:1.5;${n.read ? "" : "font-weight:600;color:var(--color-mist)"}">${n.message}</p>
            <p style="font-size:0.6875rem;color:var(--color-mute);margin-top:0.375rem">${timeAgo(n.createdAt)}</p>
          </div>
        </div>
      `).join("");
    }

    // Assign globally so onclick can see it
    window.markRead = function(id) {
      const idx = notifs.findIndex(n => n.id === id);
      if (idx !== -1 && !notifs[idx].read) {
        notifs[idx].read = true;
        renderNotifs();
      }
    };

    document.getElementById("markAllBtn").addEventListener("click", () => {
      notifs.forEach(n => n.read = true);
      renderNotifs();
    });

    renderNotifs();
  </script>
</body>
</html>
