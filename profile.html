<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Repost</title>
  <meta name="theme-color" content="#0a0912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-ambient noise" aria-hidden="true"></div>

  <main class="app-main">
    <div class="profile-grid">
      <!-- Identity Card -->
      <div>
        <div class="identity-card panel noise" style="position:relative;overflow:hidden">
          <div class="identity-glow"></div>
          <div style="position:relative">
            ${/* Avatar rendered by JS */""}
            <div id="avatarWrap" style="display:flex;justify-content:center"></div>
            <h1 class="id-name" id="idName"></h1>
            <div class="id-rating">
              <svg fill="#cdf04b" viewBox="0 0 24 24" width="16" height="16"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span class="id-rating-val" id="idRatingVal"></span>
              <span id="idRatingCount"></span>
            </div>
            <p class="id-bio" id="idBio"></p>
            <div class="id-info" id="idInfo"></div>
            <div class="id-stats" id="idStats"></div>
          </div>
        </div>
      </div>

      <!-- Editor + Reviews -->
      <div style="display:flex;flex-direction:column;gap:1.5rem">
        <!-- Profile Editor -->
        <div class="profile-editor panel">
          <h2 class="profile-editor-title">Edit profile</h2>
          <form id="profileForm" style="margin-top:1.25rem;display:flex;flex-direction:column;gap:1rem" novalidate>
            <div>
              <label class="form-label" for="editName">Display name</label>
              <input type="text" id="editName" class="input-base" />
            </div>
            <div>
              <label class="form-label" for="editBio">Bio <span style="color:var(--color-mute);font-weight:400">(optional)</span></label>
              <textarea id="editBio" class="input-base" rows="3" style="resize:vertical"></textarea>
            </div>
            <div>
              <label class="form-label" for="editUni">University <span style="color:var(--color-mute);font-weight:400">(optional)</span></label>
              <input type="text" id="editUni" class="input-base" />
            </div>
            <div>
              <label class="form-label" for="editPhone">Phone / WhatsApp <span style="color:var(--color-mute);font-weight:400">(optional)</span></label>
              <input type="tel" id="editPhone" class="input-base" />
            </div>
            <button type="submit" class="form-submit" id="profileSaveBtn">Save changes</button>
            <p id="profileSaved" style="display:none;text-align:center;font-size:0.875rem;color:var(--color-volt)">✓ Changes saved (demo mode)</p>
          </form>
        </div>

        <!-- Reviews -->
        <div>
          <h2 style="font-family:var(--font-display);font-size:1.125rem;font-weight:700;letter-spacing:-0.01em">Reviews from creators</h2>
          <div id="reviewsList" style="margin-top:0.75rem"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    buildAppShell("profile");

    const u = MOCK_USER;

    // Avatar
    document.getElementById("avatarWrap").innerHTML = avatarHtml(u.name, u.avatarColor, "xl");
    document.getElementById("idName").textContent = u.name;
    document.getElementById("idRatingVal").textContent = u.ratingAvg.toFixed(1);
    document.getElementById("idRatingCount").textContent = `(${u.ratingCount} review${u.ratingCount === 1 ? "" : "s"})`;
    if (u.bio) document.getElementById("idBio").textContent = u.bio;

    // Info rows
    const info = document.getElementById("idInfo");
    info.innerHTML = `
      <div class="id-info-row"><svg viewBox="0 0 24 24" fill="none" stroke="var(--color-brand)" stroke-width="2" width="14" height="14" style="flex-shrink:0"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> ${u.email}</div>
      ${u.university ? `<div class="id-info-row"><svg viewBox="0 0 24 24" fill="none" stroke="var(--color-volt)" stroke-width="2" width="14" height="14" style="flex-shrink:0"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> ${u.university}</div>` : ""}
      <div class="id-info-row"><svg viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2" width="14" height="14" style="flex-shrink:0"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg> Member since ${new Date(u.createdAt).toLocaleDateString("en-GB", { year:"numeric", month:"long" })}</div>`;

    // Stats
    const tier = u.sharesCompleted >= 20 ? "Pro" : u.sharesCompleted >= 5 ? "Active" : "Rookie";
    document.getElementById("idStats").innerHTML = `
      <div class="id-stat"><p class="id-stat-val" style="color:var(--color-volt)">${u.sharesCompleted}</p><p class="id-stat-lbl">Paid shares</p></div>
      <div class="id-stat"><p class="id-stat-val" style="color:var(--color-brand)">${tier}</p><p class="id-stat-lbl">Sharer tier</p></div>`;

    // Form prefill
    document.getElementById("editName").value = u.name;
    document.getElementById("editBio").value = u.bio || "";
    document.getElementById("editUni").value = u.university || "";
    document.getElementById("editPhone").value = u.phone || "";

    document.getElementById("profileForm").addEventListener("submit", e => {
      e.preventDefault();
      const btn = document.getElementById("profileSaveBtn");
      btn.disabled = true; btn.textContent = "Saving…";
      setTimeout(() => {
        btn.disabled = false; btn.textContent = "Save changes";
        document.getElementById("profileSaved").style.display = "block";
        setTimeout(() => { document.getElementById("profileSaved").style.display = "none"; }, 3000);
      }, 700);
    });

    // Reviews
    const reviewsEl = document.getElementById("reviewsList");
    if (MOCK_REVIEWS.length === 0) {
      reviewsEl.innerHTML = `<div class="panel" style="padding:1.5rem;text-align:center;font-size:0.875rem;color:var(--color-mute)">No reviews yet — approved shares can earn you a rating.</div>`;
    } else {
      reviewsEl.innerHTML = MOCK_REVIEWS.map(r => `
        <div class="panel" style="padding:1.25rem;margin-bottom:0.75rem">
          <div style="display:flex;align-items:center;gap:0.75rem">
            ${avatarHtml(r.reviewer.name, r.reviewer.avatarColor, "sm")}
            <div style="flex:1;min-width:0">
              <p style="font-family:var(--font-display);font-size:0.875rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${r.reviewer.name}</p>
              <p style="font-size:0.6875rem;color:var(--color-mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">on "${r.campaign.title}"</p>
            </div>
            ${starsHtml(r.rating)}
          </div>
          ${r.comment ? `<p style="margin-top:0.75rem;font-size:0.875rem;line-height:1.6;color:var(--color-mute)">"${r.comment}"</p>` : ""}
        </div>`).join("");
    }
  </script>
</body>
</html>
