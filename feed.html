<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover campaigns · Repost</title>
  <meta name="theme-color" content="#0a0912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-ambient noise" aria-hidden="true"></div>

  <main class="app-main" id="feedMain">
    <!-- greeting -->
    <div style="margin-bottom:1.5rem">
      <p class="page-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 11a9 9 0 019-9"/><path d="M4 4a16 16 0 0116 16"/><circle cx="5" cy="19" r="1"/></svg>
        Discover
      </p>
      <h1 class="page-h1">Hey, <span class="text-volt" id="greetingName"></span> — pick a campaign</h1>
    </div>

    <!-- Stats strip -->
    <div style="display:flex;gap:0.875rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <div class="panel" style="display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1.25rem;flex:1;min-width:150px">
        <span style="color:var(--color-volt)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
        <div>
          <p style="font-family:var(--font-display);font-size:1.125rem;font-weight:800" id="balanceDisplay"></p>
          <p style="font-size:0.7rem;color:var(--color-mute)">Wallet balance</p>
        </div>
      </div>
      <div class="panel" style="display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1.25rem;flex:1;min-width:150px">
        <span style="color:var(--color-brand)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
        <div>
          <p style="font-family:var(--font-display);font-size:1.125rem;font-weight:800" id="sharesDisplay"></p>
          <p style="font-size:0.7rem;color:var(--color-mute)">Shares completed</p>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div id="filterWrap" class="feed-meta"></div>

    <!-- Search -->
    <div style="margin-top:1rem;position:relative">
      <input type="search" id="searchInput" class="input-base" placeholder="Search campaigns…" style="padding-left:2.75rem" />
      <svg style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:var(--color-mute)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>

    <!-- Grid -->
    <div class="feed-grid" id="feedGrid"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    buildAppShell("feed");
    initReveal();

    document.getElementById("greetingName").textContent = MOCK_USER.name.split(" ")[0];
    document.getElementById("balanceDisplay").textContent = formatMoney(MOCK_USER.balanceCents);
    document.getElementById("sharesDisplay").textContent = MOCK_USER.sharesCompleted;

    // Category filters
    let activeCategory = "All";
    let searchQ = "";
    const filterWrap = document.getElementById("filterWrap");
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "feed-filter-btn" + (cat === "All" ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        activeCategory = cat;
        document.querySelectorAll(".feed-filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderFeed();
      });
      filterWrap.appendChild(btn);
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQ = e.target.value.toLowerCase();
      renderFeed();
    });

    function renderFeed() {
      const grid = document.getElementById("feedGrid");
      let items = MOCK_CAMPAIGNS.filter(c => {
        if (activeCategory !== "All" && c.category !== activeCategory) return false;
        if (searchQ && !c.title.toLowerCase().includes(searchQ) && !c.category.toLowerCase().includes(searchQ)) return false;
        return true;
      });

      if (items.length === 0) {
        grid.innerHTML = `<div class="panel empty-state" style="grid-column:1/-1;margin-top:0">
          <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <h3 class="empty-title">No campaigns found</h3>
          <p class="empty-sub">Try a different search or filter.</p>
        </div>`;
        return;
      }

      grid.innerHTML = items.map(c => {
        const pct = Math.round((c.usedSlots / c.totalShares) * 100);
        return `
          <a href="campaign.html?id=${c.id}" class="feed-card">
            <div class="feed-card-img">
              <img src="${c.imageUrl}" alt="" onerror="this.parentElement.style.background='linear-gradient(135deg,#1a0a2e,#0d1a0a)';this.style.opacity='0'">
              <div class="feed-card-overlay"></div>
              <span class="campaign-cat">${c.category}</span>
              <span class="campaign-price">${formatMoney(c.perShareCents)}</span>
            </div>
            <div class="campaign-body">
              <p class="campaign-title">${c.title}</p>
              <div class="campaign-meta">
                ${platformRowHtml(c.platforms, "sm")}
                <span class="campaign-slot">${c.usedSlots}/${c.totalShares}</span>
              </div>
              <div class="campaign-progress" style="margin-top:0.5rem">${progressHtml(pct)}</div>
              <p style="margin-top:0.375rem;font-size:0.6875rem;color:var(--color-mute)">by ${c.creatorName}</p>
            </div>
          </a>`;
      }).join("");
    }

    renderFeed();
  </script>
</body>
</html>
