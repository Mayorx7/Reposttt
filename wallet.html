<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet · Repost</title>
  <meta name="theme-color" content="#0a0912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-ambient noise" aria-hidden="true"></div>

  <main class="app-main">
    <p class="page-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L4 7h16l-4-4z"/></svg>
      Wallet
    </p>
    <h1 class="page-h1">Your money</h1>

    <!-- Balance hero -->
    <div class="wallet-hero">
      <div class="wallet-hero-glow1"></div>
      <div class="wallet-hero-glow2"></div>
      <div class="wallet-hero-inner">
        <div>
          <p class="wallet-label-small">Available balance</p>
          <p class="wallet-balance" id="walletBalance"></p>
          <p class="wallet-pending" id="walletPending" style="display:none"></p>
        </div>
        <div class="wallet-actions">
          <button class="wallet-action-btn wallet-deposit" id="depositBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            Top up
          </button>
          <button class="wallet-action-btn wallet-withdraw-btn" id="withdrawBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            Withdraw
          </button>
        </div>
      </div>
    </div>

    <!-- Transactions -->
    <h2 class="section-title">Activity</h2>
    <div id="txnContainer"></div>

    <!-- Modal -->
    <div id="modal" style="display:none;position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)">
      <div class="panel" style="width:100%;max-width:22rem;padding:1.75rem;position:relative">
        <button onclick="closeModal()" style="position:absolute;top:1rem;right:1rem;color:var(--color-mute);background:none;border:none;cursor:pointer;font-size:1.25rem">✕</button>
        <h3 style="font-family:var(--font-display);font-size:1.125rem;font-weight:700" id="modalTitle"></h3>
        <form id="walletForm" style="margin-top:1.25rem;display:flex;flex-direction:column;gap:1rem">
          <div>
            <label class="form-label" for="amountInput">Amount (&#8358;)</label>
            <input type="number" id="amountInput" class="input-base" placeholder="10.00" min="1" step="0.01" required />
          </div>
          <div id="bankRow" style="display:none">
            <label class="form-label" for="bankInput">Bank account / MoMo number</label>
            <input type="text" id="bankInput" class="input-base" placeholder="e.g. GTBank ****1234" />
          </div>
          <button type="submit" class="form-submit" id="walletSubmitBtn"></button>
        </form>
        <p id="modalSuccess" style="display:none;margin-top:1rem;text-align:center;font-family:var(--font-display);font-size:0.9rem;color:var(--color-volt)">✓ Done! This is a demo — no real transaction was made.</p>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    buildAppShell("wallet");

    const txns = MOCK_TRANSACTIONS;
    const pendingOut = txns.filter(t => t.type === "withdrawal" && t.status === "pending").reduce((a, t) => a + Math.abs(t.amountCents), 0);

    document.getElementById("walletBalance").textContent = formatMoney(MOCK_USER.balanceCents);
    if (pendingOut > 0) {
      const p = document.getElementById("walletPending");
      p.textContent = formatMoney(pendingOut) + " payout in flight";
      p.style.display = "block";
    }

    // Transactions
    const TYPE_META = {
      deposit:    { label: "Top-up",        tone: "color:var(--color-volt);background:rgba(205,240,75,0.12);box-shadow:0 0 0 1px rgba(205,240,75,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 5v14M5 12l7 7 7-7"/></svg>` },
      earning:    { label: "Share payout",  tone: "color:var(--color-volt);background:rgba(205,240,75,0.12);box-shadow:0 0 0 1px rgba(205,240,75,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 5v14M5 12l7 7 7-7"/></svg>` },
      escrow:     { label: "Campaign escrow", tone: "color:var(--color-brand);background:rgba(139,92,246,0.12);box-shadow:0 0 0 1px rgba(139,92,246,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>` },
      withdrawal: { label: "Withdrawal",    tone: "color:#fbbf24;background:rgba(251,191,36,0.12);box-shadow:0 0 0 1px rgba(251,191,36,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7"/></svg>` },
      refund:     { label: "Refund",        tone: "color:#7dd3fc;background:rgba(125,211,252,0.12);box-shadow:0 0 0 1px rgba(125,211,252,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>` },
      bonus:      { label: "Bonus",         tone: "color:#e879f9;background:rgba(232,121,249,0.12);box-shadow:0 0 0 1px rgba(232,121,249,0.3)", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>` },
    };

    const container = document.getElementById("txnContainer");
    if (txns.length === 0) {
      container.innerHTML = `<div class="panel empty-state" style="margin-top:1rem">
        <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/></svg></span>
        <p style="margin-top:1rem;font-family:var(--font-display);font-weight:700">No activity yet</p>
        <p class="empty-sub">Top up to launch a campaign, or earn from the sharer feed.</p>
      </div>`;
    } else {
      container.innerHTML = `<div class="txn-list">${txns.map(t => {
        const meta = TYPE_META[t.type] || TYPE_META.deposit;
        const pos = t.amountCents > 0;
        const statusTag = t.status === "pending"
          ? `<span style="background:rgba(251,191,36,0.15);border-radius:99px;padding:0.125rem 0.5rem;font-size:0.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#fbbf24;box-shadow:0 0 0 1px rgba(251,191,36,0.3)">pending</span>`
          : t.status === "failed"
          ? `<span style="background:rgba(251,113,133,0.15);border-radius:99px;padding:0.125rem 0.5rem;font-size:0.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-blush);box-shadow:0 0 0 1px rgba(251,113,133,0.3)">failed</span>`
          : "";
        return `
          <div class="txn-row">
            <span class="txn-icon" style="${meta.tone}">${meta.icon}</span>
            <div style="flex:1;min-width:0">
              <p class="txn-label">${meta.label} ${statusTag}</p>
              <p class="txn-note">${t.note || "—"}</p>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <p class="txn-amount ${pos ? "positive" : ""}">${formatMoneySign(t.amountCents)}</p>
              <p class="txn-time">${timeAgo(t.createdAt)}</p>
            </div>
          </div>`;
      }).join("")}</div>`;
    }

    // Modal
    function openModal(type) {
      const isDeposit = type === "deposit";
      document.getElementById("modalTitle").textContent = isDeposit ? "Top up wallet" : "Withdraw funds";
      document.getElementById("walletSubmitBtn").textContent = isDeposit ? "Add funds" : "Request withdrawal";
      document.getElementById("bankRow").style.display = isDeposit ? "none" : "block";
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modalSuccess").style.display = "none";
    }
    function closeModal() { document.getElementById("modal").style.display = "none"; }
    document.getElementById("depositBtn").addEventListener("click", () => openModal("deposit"));
    document.getElementById("withdrawBtn").addEventListener("click", () => openModal("withdraw"));
    document.getElementById("modal").addEventListener("click", e => { if (e.target === document.getElementById("modal")) closeModal(); });
    document.getElementById("walletForm").addEventListener("submit", e => {
      e.preventDefault();
      const btn = document.getElementById("walletSubmitBtn");
      btn.disabled = true; btn.textContent = "Processing…";
      setTimeout(() => {
        document.getElementById("walletForm").style.display = "none";
        document.getElementById("modalSuccess").style.display = "block";
      }, 1000);
    });
  </script>
</body>
</html>
